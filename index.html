<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>img{max-width:100%}</style>
<script>window.SVS_API = "https://svs-ai.manuelavanzi.workers.dev"; // URL del backend AI (vedi server/README.md)</script>
<title>Sport e Stili di Vita</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#FAFBFA;
  --glass:rgba(255,255,255,.74); --glass-strong:rgba(255,255,255,.86);
  --glass-border:rgba(255,255,255,.8);
  --panel-solid:#FDFEFD;
  --ink:#17211B; --ink2:#5A685F; --faint:#8B988F;
  --accent:#1F7A56; --on-accent:#FFFFFF;
  --accent-soft:rgba(31,122,86,.08);
  --teal:#3E8E7A;
  --ok:#2E8C62; --warn:#A8752C;
  --line:rgba(23,33,27,.12); --line-soft:rgba(23,33,27,.065);
  --c1:#1F7A56; --c2:#3E8E7A; --c3:#79A38F; --c4:#B3C6BA;
  --shadow:0 10px 34px rgba(20,32,26,.08);
  --inset-hi:inset 0 1px 0 rgba(255,255,255,.55);
  --amb1:rgba(78,168,128,.09); --amb2:rgba(140,200,170,.08); --amb3:rgba(46,124,92,.055);
  /* alias legacy */
  --primary:var(--accent); --on-primary:var(--on-accent); --primary-soft:var(--accent-soft);
  --energy:var(--accent); --on-energy:var(--on-accent); --energy-soft:var(--accent-soft);
  --blu:var(--teal); --blu-soft:rgba(62,142,122,.10);
  --surface:var(--glass); --surface2:rgba(23,33,27,.045); --inset:rgba(255,255,255,.62);
}
*{box-sizing:border-box}
html{-webkit-font-smoothing:antialiased}
body{margin:0; background:var(--bg); color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:.9375rem; line-height:1.52; font-weight:400;}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(640px 420px at 10% -6%, var(--amb1), transparent 62%),
    radial-gradient(760px 520px at 96% 12%, var(--amb2), transparent 66%),
    radial-gradient(900px 640px at 46% 112%, var(--amb3), transparent 62%);}
h1,h2,h3,h4{margin:0; font-family:Manrope,Inter,system-ui,sans-serif; text-wrap:balance;
  font-weight:700; letter-spacing:-.015em}
p{margin:.4rem 0}
button{font:inherit; color:inherit; cursor:pointer; border:none; background:none}
input,select,textarea{font:inherit; color:var(--ink)}
svg{display:block}
.num{font-variant-numeric:tabular-nums; letter-spacing:-.01em}
.prose{font-size:.96rem; line-height:1.66; max-width:64ch; color:var(--ink)}
.prose b{font-weight:600}

/* ---------- glass primitives ---------- */
.card,.topbar,dialog,.calc{
  background:var(--glass);
  -webkit-backdrop-filter:blur(26px) saturate(1.55);
  backdrop-filter:blur(26px) saturate(1.55);
}
@supports not ((backdrop-filter:blur(4px)) or (-webkit-backdrop-filter:blur(4px))){
  .card,.topbar,dialog,.calc{background:var(--panel-solid)}
}

/* ---------- header / stepper ---------- */
.topbar{position:sticky; top:0; z-index:30; background:var(--glass-strong);
  border-bottom:1px solid var(--line-soft);
  padding:.62rem 1.3rem; display:flex; align-items:center; gap:1.2rem; flex-wrap:wrap}
.wordmark{display:flex; align-items:center; gap:.6rem}
.wordmark .mark{width:1.75rem; height:1.75rem; border-radius:50%;
  background:linear-gradient(145deg, var(--accent), var(--teal));
  display:grid; place-items:center; color:var(--on-accent);
  box-shadow:0 2px 8px var(--accent-soft), var(--inset-hi)}
.wordmark b{font-family:Manrope,sans-serif; font-weight:800; font-size:1rem; letter-spacing:-.01em}
.stepper{display:flex; gap:.15rem; flex-wrap:wrap; margin-left:auto;
  background:var(--surface2); border:1px solid var(--line-soft); border-radius:999px; padding:.22rem}
.step{display:flex; align-items:center; gap:.42rem; padding:.36rem .85rem; border-radius:999px;
  font-size:.82rem; font-weight:500; color:var(--ink2); transition:background .18s, color .18s}
.step .n{font-size:.72rem; font-weight:600; color:var(--faint); width:auto; height:auto; background:none}
.step:hover{color:var(--ink)}
.step.cur{background:var(--glass-strong); color:var(--ink);
  box-shadow:0 1px 6px rgba(20,32,26,.14), var(--inset-hi)}
.step.cur .n{color:var(--accent)}
.step.done .n{color:var(--ok)}
@media (max-width:900px){ .step span.lbl{display:none} .stepper{margin-left:0} }

.shell{max-width:1080px; margin:0 auto; padding:1.5rem 1.2rem 3.5rem}
.view{display:grid; gap:1.35rem}
.card{border:1px solid var(--glass-border); border-radius:22px;
  box-shadow:var(--shadow), var(--inset-hi)}
.pad{padding:1.5rem 1.7rem}
@media (max-width:640px){ .pad{padding:1.1rem 1.15rem} }
.eyebrow,.eyebrow.green{font-family:Inter,sans-serif; font-size:.68rem; font-weight:600;
  letter-spacing:.13em; text-transform:uppercase; color:var(--faint)}
.btn{display:inline-flex; align-items:center; gap:.5rem; border:1px solid var(--line);
  background:var(--inset); border-radius:999px; padding:.52rem 1.1rem; font-weight:500; font-size:.9rem;
  transition:border-color .15s, background .15s, filter .15s}
.btn:hover{border-color:var(--faint)}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px}
.btn.primary,.btn.energy{background:var(--accent); border-color:transparent; color:var(--on-accent);
  font-weight:600; box-shadow:0 4px 14px var(--accent-soft), var(--inset-hi)}
.btn.primary:hover,.btn.energy:hover{filter:brightness(1.07)}
.btn svg{width:1.02rem; height:1.02rem}
.btn[disabled]{opacity:.5; cursor:default}
.linkish{color:var(--accent); font-weight:600; text-decoration:none}
.linkish:hover{text-decoration:underline; text-underline-offset:3px}

/* ---------- section 1 ---------- */
.hero-photo{position:relative; border-radius:26px; overflow:hidden; min-height:400px;
  display:flex; align-items:center; border:1px solid var(--glass-border); box-shadow:var(--shadow)}
.hero-photo img.bg,.photo-head img.bg,.strip img.bg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
.hero-photo .veil{position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(250,251,250,.94) 0%, rgba(250,251,250,.82) 40%, rgba(250,251,250,.05) 75%)}
.hero-photo .inner{position:relative; padding:3rem 3rem; max-width:37rem; display:grid; gap:.5rem}
.hero-photo h1{font-size:clamp(1.8rem, 3.7vw, 2.7rem); font-weight:800; line-height:1.07; letter-spacing:-.028em}
.hero-photo h1 em{font-style:normal; color:var(--accent)}
.hero-photo .sub{color:var(--ink2); font-size:1.03rem; max-width:44ch; margin:0}
.hero-cta{display:flex; gap:.7rem; margin-top:1.1rem; flex-wrap:wrap}
@media (max-width:720px){ .hero-photo{min-height:340px} .hero-photo .veil{background:rgba(250,251,250,.85)}
  .hero-photo .inner{padding:1.7rem 1.4rem} }
.photo-head{position:relative; border-radius:22px; overflow:hidden; min-height:170px;
  display:flex; align-items:flex-end; border:1px solid var(--glass-border); box-shadow:var(--shadow)}
.photo-head .veil{position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(250,251,250,.04) 20%, rgba(250,251,250,.93) 82%)}
.photo-head .inner{position:relative; width:100%; padding:2.2rem 1.5rem .95rem; display:flex;
  align-items:baseline; gap:.7rem; flex-wrap:wrap}
.photo-head h2{font-size:1.45rem; font-weight:800; letter-spacing:-.022em}
.photo-head .sub{color:var(--ink2); font-size:.9rem}
.strip{position:relative; border-radius:26px; overflow:hidden; min-height:210px;
  display:flex; align-items:center; border:1px solid var(--glass-border); box-shadow:var(--shadow)}
.strip .veil{position:absolute; inset:0;
  background:linear-gradient(90deg, rgba(250,251,250,.95) 0%, rgba(250,251,250,.6) 55%, rgba(250,251,250,.08) 85%)}
.strip .inner{position:relative; padding:1.9rem 2.2rem; display:grid; gap:.35rem; max-width:32rem}
.strip h3{font-size:1.25rem; font-weight:800; letter-spacing:-.02em}
.strip p{color:var(--ink2); margin:0}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:1.4rem; align-items:start}
@media (max-width:820px){ .grid2{grid-template-columns:1fr} }
.steps{display:grid; gap:.75rem; margin-top:1rem}
.stp{display:flex; gap:.75rem; align-items:flex-start}
.stp .n{flex:none; width:1.6rem; height:1.6rem; border-radius:50%; background:var(--surface2);
  display:grid; place-items:center; font-size:.78rem; font-weight:700; color:var(--ink2);
  font-family:Manrope,sans-serif; margin-top:.1rem}
.stp b{font-weight:600; font-size:.92rem}
.stp p{margin:.15rem 0 0; font-size:.86rem; color:var(--ink2)}
.imcwrap{margin-top:1.3rem}
.imclbl{font-size:.78rem; font-weight:600; color:var(--ink2); margin-bottom:1.9rem}
.imcscale .imcdot{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:18px; height:18px;
  border-radius:50%; background:var(--accent); border:3px solid #fff;
  box-shadow:0 1px 6px rgba(20,32,26,.35); transition:left .7s cubic-bezier(.3,.7,.3,1); z-index:1}
.imcscale .imcdotlbl{position:absolute; top:-1.9rem; left:50%; transform:translateX(-50%);
  font-family:Manrope,sans-serif; font-weight:800; font-size:.92rem; color:var(--accent);
  transition:left .7s cubic-bezier(.3,.7,.3,1)}
.imcscale .imcdot.out{background:var(--warn)}
.imcscale .imcdotlbl.out{color:var(--warn)}
@media (prefers-reduced-motion: reduce){ .imcscale .imcdot,.imcscale .imcdotlbl{transition:none} }
.imcscale{position:relative; display:flex; gap:3px; height:12px}
.imcscale i{display:block; height:100%; border-radius:999px; background:var(--surface2)}
.imcscale i.on{background:var(--c2)}
.imcscale i.mid{background:rgba(23,33,27,.13)}
.imcscale i.hi{background:rgba(23,33,27,.22)}
.imcscale .tick{position:absolute; top:15px; transform:translateX(-50%); font-size:.72rem;
  color:var(--faint); font-variant-numeric:tabular-nums}
.imczones{display:flex; margin-top:1.45rem; font-size:.74rem; color:var(--ink2)}
.imczones span{text-align:center}
.imczones span.on{color:var(--accent); font-weight:600}
.gloss{display:grid; grid-template-columns:repeat(auto-fill,minmax(235px,1fr)); gap:.6rem}
.gloss .g{background:var(--inset); border:1px solid var(--line-soft); border-radius:14px; padding:.75rem .9rem}
.gloss .g b{font-size:.88rem; font-weight:600}
.gloss .g p{font-size:.82rem; color:var(--ink2); margin:.28rem 0 0}
.calc{display:grid; gap:.8rem; border:1px solid var(--glass-border); border-radius:18px; padding:1.1rem;
  box-shadow:var(--inset-hi)}
.calc>b{font-family:Manrope,sans-serif; letter-spacing:-.01em}
.calc .row{display:flex; gap:.7rem; flex-wrap:wrap; align-items:end}
.field{display:grid; gap:.28rem}
.field>span{font-size:.74rem; font-weight:500; color:var(--ink2)}
.field input,.field select,.field textarea{background:var(--inset); border:1px solid var(--line);
  border-radius:11px; padding:.48rem .65rem; min-width:0}
.calc .res{font-size:1rem}
.calc .res b{font-size:1.25rem; font-family:Manrope,sans-serif}

/* ---------- section 2 ---------- */
.dropzone{border:1.5px dashed var(--line); border-radius:18px; background:var(--inset);
  padding:2rem 1rem; display:grid; gap:.45rem; justify-items:center; text-align:center; cursor:pointer;
  transition:border-color .15s, background .15s}
.dropzone:hover,.dropzone.over{border-color:var(--accent); background:var(--accent-soft)}
.dropzone svg{width:1.8rem; height:1.8rem; color:var(--faint)}
.dropzone b{font-weight:600; font-family:Manrope,sans-serif; letter-spacing:-.01em}
.dropzone small{color:var(--ink2); max-width:40ch}
.upstate{display:grid; gap:.7rem; justify-items:center; padding:1rem .5rem; text-align:center}
.spin{width:1.8rem; height:1.8rem; border-radius:50%; border:2.5px solid var(--surface2);
  border-top-color:var(--accent); animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation-duration:2.5s} }
.preview-doc{max-height:170px; border-radius:14px; overflow:hidden; box-shadow:var(--shadow)}
.preview-doc img{max-height:170px; display:block}
.doccard{border:1px solid var(--line-soft); border-left:4px solid var(--accent); border-radius:18px;
  padding:1rem 1.1rem; display:grid; gap:.6rem; background:var(--inset)}
.doccard .codebar{display:flex; align-items:center; gap:.7rem; flex-wrap:wrap}
.doccard .code{font-family:Manrope,sans-serif; font-weight:800; font-size:1.12rem; letter-spacing:-.01em; color:var(--accent)}
.doccard .codebar{padding-bottom:.55rem; border-bottom:1px solid color-mix(in srgb, var(--accent) 22%, transparent)}
.doccard .chip{font-size:.7rem; font-weight:600; background:var(--surface2); color:var(--ink2);
  border-radius:999px; padding:.16rem .62rem}
.kv{display:grid; grid-template-columns:repeat(auto-fill,minmax(128px,1fr)); gap:.45rem}
.kv .k{background:var(--glass); border:1px solid var(--line-soft); border-top:2px solid var(--c2);
  border-radius:12px; padding:.45rem .6rem}
.kv .k span{display:block; font-size:.64rem; text-transform:uppercase; letter-spacing:.06em;
  color:var(--faint); white-space:nowrap; font-weight:500}
.kv .k b{font-size:1rem; font-family:Manrope,sans-serif; font-weight:700}
.kv .k b small{font-weight:400; color:var(--ink2); font-size:.68rem}
.notice{border:1px solid var(--line-soft); background:var(--inset); border-radius:14px;
  padding:.65rem .9rem; font-size:.84rem; color:var(--ink2); display:flex; gap:.55rem}
.notice svg{width:1rem; height:1rem; flex:none; margin-top:.16rem}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
.notice.good{border-color:color-mix(in srgb,var(--ok) 32%,transparent); color:var(--ink)}
.qgrid{display:grid; gap:.85rem}
.qgrid textarea{resize:vertical}
.hint{font-size:.78rem; color:var(--faint)}

/* ---------- sections 3-4 ---------- */
.numbers{display:flex; gap:.6rem; flex-wrap:wrap}
.bignum{background:var(--inset); border:1px solid var(--line-soft); border-radius:14px; padding:.6rem 1rem}
.bignum span{display:block; font-size:.66rem; text-transform:uppercase; letter-spacing:.07em;
  color:var(--faint); font-weight:500}
.bignum b{font-size:1.4rem; font-weight:800; font-family:Manrope,sans-serif; letter-spacing:-.02em}
.bignum b small{font-size:.72rem; font-weight:400; color:var(--ink2)}
.meals{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.6rem}
.meal{border:1px solid var(--line-soft); border-radius:14px; padding:.8rem .9rem; background:var(--inset);
  display:grid; gap:.2rem; align-content:start}
.meal .pct{font-weight:800; font-size:1.2rem; font-family:Manrope,sans-serif; letter-spacing:-.02em}
.meal h4{font-size:.9rem; font-weight:600; letter-spacing:0}
.meal .kcal{font-size:.8rem; color:var(--ink2)}
.meal p{font-size:.8rem; color:var(--ink2); margin:.28rem 0 0}
.mealbar{display:flex; height:.62rem; border-radius:999px; overflow:hidden; border:1px solid var(--line-soft)}
.mealbar i{display:block; height:100%}
.ai-zone{display:grid; gap:.8rem}
.ai-out{display:grid; gap:.6rem}
.ai-card{border:1px solid var(--line-soft); border-radius:14px; padding:.85rem 1rem; background:var(--inset)}
.ai-card h4{font-size:.9rem; margin-bottom:.3rem; font-weight:600; letter-spacing:0}
.ai-card ul{margin:.2rem 0 0; padding-left:1.1rem; font-size:.87rem}
.ai-card li{margin:.24rem 0}
.ai-card li b{font-weight:600}
.ai-note{font-size:.78rem; color:var(--faint)}
.tabbar{display:flex; gap:.3rem; flex-wrap:wrap}
.tab{padding:.4rem .9rem; border-radius:999px; border:1px solid var(--line-soft); background:var(--inset);
  font-size:.84rem; font-weight:500; transition:background .15s, color .15s}
.tab.on{background:var(--accent); border-color:transparent; color:var(--on-accent); font-weight:600}
.menuday{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:.6rem}
.sportgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:.5rem}
.sport{border:1px solid var(--line-soft); background:var(--inset); border-radius:12px; padding:.52rem .75rem;
  display:flex; justify-content:space-between; align-items:baseline; gap:.4rem}
.sport b{font-size:.84rem; font-weight:500}
.sport span{font-size:.86rem; font-weight:700; font-family:Manrope,sans-serif; white-space:nowrap}
.sport span small{font-weight:400; color:var(--ink2); font-family:Inter,sans-serif}
.week{display:grid; gap:.3rem; font-size:.87rem}
.week .d{display:grid; grid-template-columns:6.5rem 1fr; gap:.6rem; padding:.4rem .6rem; border-radius:10px}
.week .d:nth-child(odd){background:var(--surface2)}
.week .d b{font-weight:600}
.opt-tabs{display:flex; gap:.3rem; flex-wrap:wrap}
.sec-h{display:flex; align-items:baseline; gap:.7rem; flex-wrap:wrap}
.sec-h h2{font-size:1.45rem; font-weight:800; letter-spacing:-.022em}
.sec-h .sub{color:var(--ink2); font-size:.9rem}
.foot-cta{display:flex; justify-content:space-between; gap:.7rem; flex-wrap:wrap; align-items:center}
.disclaimer{font-size:.78rem; color:var(--faint); max-width:70ch}
.demo-tag{font-size:.7rem; font-weight:600; background:var(--surface2); color:var(--ink2);
  border-radius:999px; padding:.16rem .62rem}
dialog{border:1px solid var(--glass-border); border-radius:20px; color:var(--ink);
  box-shadow:0 20px 60px rgba(8,14,10,.35), var(--inset-hi); padding:1.2rem 1.3rem;
  width:min(430px, calc(100vw - 2rem))}
dialog::backdrop{background:rgba(8,14,10,.35); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px)}
.rphoto{width:100%; max-height:290px; object-fit:cover; border-radius:16px; box-shadow:var(--shadow)}
#did1 .tube-seg{transform:scaleY(0); transform-origin:bottom; transform-box:fill-box;
  transition:transform .65s cubic-bezier(.25,.6,.3,1)}
#did1.anim-on .tube-seg{transform:scaleY(1)}
#did1 .tube-leg{opacity:0; transform:translateY(8px); transition:opacity .5s ease, transform .5s ease}
#did1.anim-on .tube-leg{opacity:1; transform:none}
.biaflow{display:flex; gap:.8rem; align-items:stretch; margin-top:.9rem}
.bstep{flex:1; background:var(--inset); border:1px solid var(--line-soft); border-radius:16px;
  padding:1rem 1.1rem; display:grid; gap:.3rem; align-content:start}
.bicon{height:64px; display:grid; place-items:center; margin-bottom:.2rem}
.bicon svg{width:120px; height:56px}
.bstep b{font-weight:600; font-size:.92rem}
.bstep p{margin:0; font-size:.85rem; color:var(--ink2)}
.bsep{align-self:center; color:var(--faint); flex:none}
.bsep svg{width:1.1rem; height:1.1rem}
@media (max-width:760px){ .biaflow{flex-direction:column} .bsep{transform:rotate(90deg)} }
@keyframes flowdash{to{stroke-dashoffset:-22}}
.flowline{animation:flowdash 1.6s linear infinite}
.flowline.fast{animation-duration:.9s}
.flowline.slow{animation-duration:3.6s; opacity:.75}
@keyframes pulsebar{0%,100%{opacity:.35} 50%{opacity:1}}
.pb{animation:pulsebar 2.6s ease-in-out infinite}
.pb:nth-of-type(1){animation-delay:0s}.pb:nth-of-type(2){animation-delay:.3s}
.pb:nth-of-type(3){animation-delay:.6s}.pb:nth-of-type(4){animation-delay:.9s}
.pb:nth-of-type(5){animation-delay:1.2s}
@media (prefers-reduced-motion: reduce){
  .flowline,.pb{animation:none}
  #did1 .tube-seg,#did1 .tube-leg{transition:none; transform:none; opacity:1}
}
.docform-grid{display:grid; grid-template-columns:1.05fr 1fr; gap:1rem; align-items:start}
.docform-img{max-height:62vh; overflow:auto; border-radius:12px; border:1px solid var(--line-soft); background:var(--surface2)}
.docform-img img{width:100%; display:block}
@media (max-width:880px){ .docform-grid{grid-template-columns:1fr} .docform-img{max-height:32vh} }
.svgwrap{overflow-x:auto}
</style>
</head>
<body>


<header class="topbar">
  <div class="wordmark">
    <span class="mark" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="15.5" cy="5" r="1.6"/><path d="M14.5 8.5 10 10l-3 3.5M14.5 8.5l-1 5-3.5 2-1.5 4.5M14.5 8.5 17 12l3.5.5M13.5 13.5 16 17l1 4"/></svg>
    </span>
    <b>Sport e Stili di Vita</b>
  </div>
  <nav class="stepper" id="stepper" aria-label="Sezioni"></nav>
</header>

<main class="shell" id="main"></main>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ================= helpers ================= */

const API_BASE = (window.SVS_API || "").replace(/\/$/, "");
const aiMode = () => API_BASE ? "backend" : (cap.sample ? "claude" : null);
const aiImagesOk = () => API_BASE ? true : !!(cap.sample && cap.images);
async function blobToB64(blob){
  const bytes = new Uint8Array(await blob.arrayBuffer());
  let bin = "";
  for(let i = 0; i < bytes.length; i += 32768) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+32768));
  return btoa(bin);
}
async function apiPost(path, body, signal){
  let r;
  try{
    r = await fetch(API_BASE + path, { method:"POST", signal,
      headers:{"content-type":"application/json"}, body: JSON.stringify(body) });
  }catch(e){
    if(e && e.name === "AbortError") throw {code:"cancelled"};
    throw {code:"upstream_error", message:"backend non raggiungibile"};
  }
  if(!r.ok){
    const t = await r.text().catch(() => "");
    throw {code: r.status === 429 ? "rate_limited" : "upstream_error", message: t.slice(0, 200)};
  }
  return r.json();
}
function advisePayload(kind){
  const d = state.doc || {}, g = state.gusti || {};
  const kcal = d.kcal || (d.bmr ? Math.round(d.bmr*1.45) : 2000);
  return kind === "food"
    ? { bia: {sesso:d.sex, eta:d.age, altezza_cm:d.height, peso_kg:d.weight, imc:d.bmi, grasso_pct:d.pbf, muscolo_kg:d.smm, metabolismo_basale_kcal:d.bmr, fabbisogno_kcal:kcal, grasso_viscerale_livello:d.vfl, punteggio:d.score, peso_target_kg:d.targetWeight}, gusti: g }
    : { bia: {sesso:d.sex, eta:d.age, altezza_cm:d.height, peso_kg:d.weight, imc:d.bmi, grasso_pct:d.pbf, muscolo_kg:d.smm, punteggio:d.score, grasso_viscerale:d.vfl, dispendio_30min:(d.energy||[]).slice(0,20)}, gusti: g };
}

const STEPS = [["s1","Benessere e BIA"],["s2","Carica i dati"],["s3","Mangia meglio"],["s4","Attività sportive"]];
function goto(v){ state.view = v; if(v!=="s1") state.introSeen = true; save(); render(); window.scrollTo({top:0}); }
function renderStepper(){
  const doneMap = { s1: state.introSeen && state.view!=="s1", s2: !!state.doc && state.view!=="s2" };
  $("#stepper").innerHTML = STEPS.map(([id,lbl],i) => `
    <button class="step${state.view===id?" cur":""}${doneMap[id]?" done":""}" data-go="${id}">
      <span class="n">${doneMap[id]?"✓":i+1}</span><span class="lbl">${lbl}</span>
    </button>`).join("");
  $$("#stepper [data-go]").forEach(b => b.onclick = () => goto(b.dataset.go));
}

/* ================= SVG didattici ================= */
function svgComposizione(){
  const parts = [
    ["Acqua corporea","~60%",60,"var(--c2)","il mezzo di tutti gli scambi, dentro e fuori le cellule"],
    ["Proteine","~17%",17,"var(--c1)","i mattoni di muscoli e tessuti"],
    ["Minerali","~6%",6,"var(--c3)","calcio e fosforo: la struttura delle ossa"],
    ["Massa grassa","~17%",17,"var(--c4)","la riserva di energia, sotto pelle e attorno agli organi"],
  ];
  const W=560, colX=26, colW=92, colY=14, colH=330;
  let acc = 0;
  const rects = parts.map(([n,pl,p,c], i) => {
    const y = colY + acc/100*colH, h = p/100*colH; acc += p;
    return `<rect class="tube-seg" style="transition-delay:${((3-i)*0.16).toFixed(2)}s" x="${colX}" y="${y.toFixed(1)}" width="${colW}" height="${Math.max(2,h-2).toFixed(1)}" fill="${c}"/>`;
  }).join("");
  const legend = parts.map(([n,pl,p,c,desc],i) => { const y = colY + 22 + i*80;
    return `<g class="tube-leg" style="transition-delay:${(0.35+(3-i)*0.16).toFixed(2)}s">
      <rect x="170" y="${y}" width="13" height="13" rx="4" fill="${c}"/>
      <text x="194" y="${y+11}" font-size="14" font-weight="600" fill="var(--ink)" font-family="Inter,sans-serif">${n} <tspan font-weight="700">${pl}</tspan></text>
      <text x="194" y="${y+30}" font-size="11.5" fill="var(--ink2)" font-family="Inter,sans-serif">${desc}</text></g>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} 378" role="img" aria-label="Composizione tipica del corpo umano">
    <defs><clipPath id="tubeclip"><rect x="${colX}" y="${colY}" width="${colW}" height="${colH}" rx="28"/></clipPath></defs>
    <rect x="${colX}" y="${colY}" width="${colW}" height="${colH}" rx="28" fill="var(--surface2)"/>
    <g clip-path="url(#tubeclip)">${rects}</g>
    ${legend}
    <text x="${colX-6}" y="370" font-size="11" fill="var(--faint)" font-family="Inter,sans-serif">Valori indicativi per un adulto in salute: la BIA li misura uno per uno.</text>
  </svg>`;
}

    <div class="inner">
      <h1>Capisci il tuo corpo, <em>allena</em> il tuo stile di vita</h1>
      <p class="sub">Dai numeri della bilancia bioimpedenziometrica ai consigli su alimentazione
        e movimento, costruiti sui tuoi gusti e sui luoghi in cui vivi o viaggi.</p>
      <div class="hero-cta">
        <button class="btn energy" data-go="s2">${icon("upload")}Carica i dati della BIA</button>
        <button class="btn" onclick="document.getElementById('did1').scrollIntoView({behavior:'smooth'})">Come funziona</button>
      </div>
    </div>
  </section>

  <section class="card pad" id="did1">
    <div class="eyebrow green">Di cosa è fatto il nostro corpo</div>
    <div class="grid2" style="margin-top:.7rem">
      <div>
        <p class="prose">Il corpo umano è, prima di tutto, <b>acqua</b>: è il mezzo in cui
          avvengono tutti gli scambi, e da sola ne rappresenta più della metà. Le <b>proteine</b> sono il materiale
          da costruzione dei muscoli: per questo chi si allena ne cura l'apporto. I <b>minerali</b>
          — calcio e fosforo su tutti — rendono solide le ossa. Tutto ciò che mangiamo in più rispetto
          a quello che consumiamo finisce infine nella <b>massa grassa</b>: la riserva di energia del corpo,
          preziosa in piccole quantità, ingombrante quando cresce troppo.</p>
        <p class="prose">La somma di questi quattro elementi è il <b>peso</b>. Due persone con lo stesso
          peso possono quindi avere corpi molto diversi: più muscolo e poco grasso, o il contrario.
          È per questo che la bilancia di casa racconta solo una parte della storia.</p>
      </div>
      <div class="svgwrap">${svgComposizione()}</div>
    </div>
  </section>

  <section class="card pad">
    <div class="eyebrow green">Quanto “dovrei” pesare?</div>
    <div class="grid2" style="margin-top:.7rem">
      <p class="prose">Un riferimento semplice è l'<b>IMC</b> (indice di massa corporea): il peso in kg
        diviso per l'altezza in metri, al quadrato. Per gli adulti si considera normale un IMC tra
        <b>18,5 e 25</b>. È un indice imperfetto — non distingue muscolo e grasso, e con l'età o tra
        generi cambia la composizione “tipica” — ma dà subito un intervallo di peso ragionevole.
        La BIA fa un passo in più: propone un <b>peso target</b> guardando anche a quanta massa magra
        e grassa hai davvero.</p>
      <div class="calc">
        <b>Prova: il tuo intervallo di peso consigliato</b>
        <div class="row">
          <label class="field"><span>Altezza (cm)</span><input id="calcH" inputmode="decimal" value="175" style="width:6rem"></label>
          <label class="field"><span>Età</span><input id="calcA" inputmode="numeric" value="25" style="width:5rem"></label>
          <label class="field"><span>Peso (kg) — opzionale</span><input id="calcW" inputmode="decimal" placeholder="per l'IMC" style="width:7rem"></label>
          <label class="field"><span>Genere</span><select id="calcS"><option value="M">Uomo</option><option value="F">Donna</option></select></label>
          <button class="btn primary" id="calcBtn">Calcola</button>
        </div>
        <div class="res" id="calcOut" aria-live="polite"></div>
      </div>
    </div>
    <div class="imcwrap">
      <div class="imclbl">La scala dell'IMC (kg/m²)</div>
      <div class="imcscale" aria-label="Zone dell'indice di massa corporea">
        <i style="flex:3.5"></i><i class="on" style="flex:6.5"></i><i class="mid" style="flex:5"></i><i class="hi" style="flex:5"></i>
        <span class="imcdot" id="imcDot" hidden></span>
        <span class="imcdotlbl num" id="imcDotLbl" hidden></span>
        <span class="tick" style="left:17.5%">18,5</span>
        <span class="tick" style="left:50%">25</span>
        <span class="tick" style="left:75%">30</span>
      </div>
      <div class="imczones"><span style="width:17.5%">sottopeso</span><span class="on" style="width:32.5%">normale</span><span style="width:25%">sovrappeso</span><span style="width:25%">obesità</span></div>
    </div>
  </section>

  <section class="card pad">
    <div class="eyebrow green">Come funziona la BIA</div>
    <div class="grid2" style="margin-top:.7rem; align-items:center">
      <p class="prose">La <b>bioimpedenziometria</b> non “pesa”: misura. Sfrutta una proprietà
        semplice del corpo — i tessuti ricchi d'acqua, come i muscoli, conducono l'elettricità,
        mentre il grasso la frena — e da lì ricava quanta massa magra e grassa ci sono, e dove.
        Con due frequenze (20 e 100 kHz) distingue perfino l'acqua dentro e fuori dalle cellule.
        L'esame si fa a piedi nudi sulla bilancia, impugnando le maniglie: dura meno di un minuto
        e non si avverte nulla.</p>

    <div class="eyebrow green">Le misure che troverai nel referto</div>
    <div class="gloss" style="margin-top:.7rem">
      <div class="g"><b>IMC (kg/m²)</b><p>Peso rapportato all'altezza. Normale tra 18,5 e 25.</p></div>
      <div class="g"><b>Grasso corporeo (PGC, %)</b><p>Quota del peso fatta di grasso. Orientativamente: 10–20% uomini, 18–28% donne.</p></div>
      <div class="g"><b>Muscolo scheletrico (kg)</b><p>Il muscolo “che si allena”. Più ce n'è, più energia consumi anche a riposo.</p></div>
      <div class="g"><b>Punteggio InBody (/100)</b><p>Voto sintetico della composizione: premia muscolo ed equilibrio, penalizza gli eccessi di grasso. Sopra 80 è un buon punteggio.</p></div>
      <div class="g"><b>Grasso viscerale (livello)</b><p>Il grasso attorno agli organi: è il più rischioso. Si punta a restare sotto il livello 10.</p></div>
      <div class="g"><b>Rapporto vita/fianchi</b><p>Indica dove si accumula il grasso: valori alti segnalano accumulo addominale.</p></div>
      <div class="g"><b>Metabolismo basale (kcal)</b><p>Le calorie che il corpo consuma a riposo in 24 ore, solo per funzionare.</p></div>
      <div class="g"><b>Dispendio per esercizio</b><p>Per ogni sport, le kcal che consumeresti in 30 minuti al tuo peso attuale: la base della tappa 4.</p></div>
    </div>

function wireS1(){
  $$("#main [data-go]").forEach(b => b.onclick = () => goto(b.dataset.go));
  const comp = document.getElementById("did1");
  if(comp){
    const arm = () => comp.classList.add("anim-on");
    if(!("IntersectionObserver" in window)) arm();
    else{
      const io = new IntersectionObserver(es => { if(es.some(x => x.isIntersecting)){ arm(); io.disconnect(); } }, {threshold:.25});
      io.observe(comp);
      setTimeout(arm, 3000);
    }
  }
  const out = $("#calcOut");
  const doCalc = () => {
    const h = num($("#calcH").value), a = num($("#calcA").value), w = num($("#calcW").value);
    const dot = $("#imcDot"), dlbl = $("#imcDotLbl");
    if(!h || h<120 || h>230){ out.textContent = "Inserisci un'altezza tra 120 e 230 cm."; return; }
    const m2 = (h/100)**2;
    const lo = 18.5*m2, hi = 24.9*m2;
    const extra = (a && a>=65) ? " Dopo i 65 anni un IMC fino a 27 è considerato accettabile." : "";
    let msg = `Peso consigliato: tra <b>${fmtN(lo,1)}</b> e <b>${fmtN(hi,1)} kg</b> (IMC 18,5–25).${extra}`;
    if(w && w>20 && w<350){
      const imc = w/m2;
      const zona = imc<18.5?"sottopeso":imc<25?"normale":imc<30?"sovrappeso":"obesità";
      const okz = zona==="normale";
      const p = Math.max(1.5, Math.min(98.5, (imc-15)/20*100)) + "%";
      dot.hidden = dlbl.hidden = false;
      dot.style.left = p; dlbl.style.left = p;
      dot.classList.toggle("out", !okz); dlbl.classList.toggle("out", !okz);
      dlbl.textContent = fmtN(imc,1);
      msg = `Il tuo IMC è <b>${fmtN(imc,1)}</b> — ${zona}, guarda la scala qui sotto. ` + msg;
    } else { dot.hidden = dlbl.hidden = true; }
    out.innerHTML = msg;
  };
  $("#calcBtn").onclick = doCalc;
  ["calcH","calcA","calcW"].forEach(id => { const el = $("#"+id); el.oninput = doCalc; });
  doCalc();
}

/* ---- referto → immagine: estrazione JPEG diretta dai byte del PDF ---- */
function findJpegSpan(bytes){
  let best = null, i = 0;
  while(i < bytes.length - 3){
    if(bytes[i]===0xFF && bytes[i+1]===0xD8 && bytes[i+2]===0xFF){
      let j = i+3, end = -1;
      while(j < bytes.length - 1){
        if(bytes[j]===0xFF && bytes[j+1]===0xD9){ end = j+2; break; }
        j++;
      }
      if(end > 0){
        if(!best || end-i > best[1]-best[0]) best = [i, end];
        i = end;
      } else break;
    } else i++;
  }
  return (best && best[1]-best[0] > 20000) ? bytes.subarray(best[0], best[1]) : null;
}
async function fileToCanvas(file){
  let blob = file;
  if(file.type === "application/pdf" || /\.pdf$/i.test(file.name||"")){
    const bytes = new Uint8Array(await file.arrayBuffer());
    const span = findJpegSpan(bytes);
    if(!span) throw {code:"pdf_format"};

    upStatus(`<div><b>Import non riuscito</b></div><div class="hint">${esc(msg)}</div>

function aiFoodHTML(){
  const a = state.ai.food;
  const mode = aiMode();
  if(a) return aiFoodRender(a);
  if(!mode) return `<div class="notice">${icon("info")}<span>Apri la pagina su claude.ai per generare consigli personalizzati sui tuoi dati e sui tuoi gusti.</span></div>`;
  return `<p style="color:var(--ink2);margin:0">L'AI può incrociare i numeri della tua BIA con i gusti che hai
    descritto e proporti indicazioni concrete su cosa privilegiare, cosa limitare e in quali quantità.</p>
    <div><button class="btn primary" id="btnGenFood">${icon("spark")}Genera i consigli su misura</button></div>
    <div class="upstate" id="foodState" hidden></div>`;
}
function aiFoodRender(a){
  return `<div class="ai-out">
    ${a.premessa?`<p class="prose" style="margin:0">${esc(a.premessa)}</p>`:""}
    <div class="ai-card"><h4>Da privilegiare</h4><ul>${(a.privilegiare||[]).map(x => `<li><b>${esc(x.cosa||"")}</b>${x.perche?` — ${esc(x.perche)}`:""}</li>`).join("")}</ul></div>
    <div class="ai-card energy"><h4>Da limitare</h4><ul>${(a.limitare||[]).map(x => `<li><b>${esc(x.cosa||"")}</b>${x.perche?` — ${esc(x.perche)}`:""}</li>`).join("")}</ul></div>
    <div class="ai-card blu"><h4>Quantità indicative</h4><ul>${(a.quantita||[]).map(x => `<li>${esc(x)}</li>`).join("")}</ul></div>
    <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
      <button class="btn" id="btnRegenFood">${icon("refresh")}Rigenera</button>
      <span class="ai-note">Generato dall'AI sui dati del documento n. ${esc(state.doc?.code||"—")} e sui gusti descritti.</span>
    </div></div>`;
}
function foodPrompt(){
  const p = advisePayload("food");
  return `Sei un educatore alimentare. Sulla base dei dati di una analisi della composizione corporea (BIA) e dei gusti della persona, scrivi consigli alimentari DIDATTICI in italiano (non una dieta medica: niente grammature rigide per pasto, niente diagnosi).
DATI BIA (documento anonimo): ${JSON.stringify(p.bia)}
GUSTI E ABITUDINI dichiarati: ${JSON.stringify(p.gusti)}
Tieni conto dei gusti (valorizza ciò che piace, proponi alternative concrete a ciò che va limitato) e delle abitudini dichiarate (es. se salta la colazione, spiega come reintrodurla gradualmente).
Rispondi SOLO con JSON: {"premessa": "2-3 frasi sul quadro generale di questa persona", "privilegiare": [{"cosa":"alimento o gruppo","perche":"motivo legato ai SUOI dati o gusti"}, ... 4-6 voci], "limitare": [{"cosa":"...","perche":"..."} , ... 3-5 voci], "quantita": ["indicazione pratica e misurabile (porzioni a settimana, bicchieri, cucchiai...)", ... 4-6 voci]}`;
}
let foodCtl = null;
function wireS3(){
  $$("#main [data-go]").forEach(b => b.onclick = () => goto(b.dataset.go));
  const showMenu = k => {
    $("#menuDay").innerHTML = (MENUS[k]||[]).map(([t,txt]) => `<div class="ai-card${t==="Nota"?" blu":""}"><h4>${esc(t)}</h4><p style="margin:0;font-size:.87rem">${esc(txt)}</p></div>`).join("");
    $$("#menuTabs .tab").forEach(t => t.classList.toggle("on", t.dataset.menu===k));
  };
  $$("#menuTabs .tab").forEach(t => t.onclick = () => showMenu(t.dataset.menu));
  showMenu(Object.keys(MENUS)[0]);
  const gen = $("#btnGenFood");
  if(gen) gen.onclick = async () => {
    const zone = $("#foodState");
    gen.disabled = true; zone.hidden = false;
    zone.innerHTML = `<div class="spin"></div><div class="hint" id="foodSub">L'AI sta scrivendo i consigli…</div><button class="btn" id="btnStopFood">Interrompi</button>`;
    foodCtl = new AbortController();
    $("#btnStopFood").onclick = () => foodCtl.abort();
    try{
      const a = API_BASE
        ? await apiPost("/api/advise", {kind:"food", data: advisePayload("food")}, foodCtl.signal)
        : await cap.sample.json(foodPrompt(), { modelTier:"default", signal: foodCtl.signal, cache:false,
            onText: ({text}) => { const s=$("#foodSub"); if(s) s.textContent = `Sto scrivendo… (${text.length} caratteri)`; } });
      state.ai.food = a; save(); render();
    }catch(e){
      if(e && e.code === "cancelled"){ render(); return; }
      zone.innerHTML = `<div class="hint">Non sono riuscito a generare i consigli (${esc(e && e.code || "errore")}). Riprova tra poco.</div>`;
      gen.disabled = false;
    }
  };
  const regen = $("#btnRegenFood");
  if(regen) regen.onclick = () => { delete state.ai.food; save(); render(); setTimeout(() => $("#btnGenFood")?.click(), 50); };
}

function viewS4(){
  const d = state.doc;
  const energy = (d?.energy?.length ? d.energy : MET.map(([n,met]) => [n, Math.round(met*3.5*((d?.weight)||70)/200*30)]));

    <div class="veil" aria-hidden="true"></div>
    <div class="inner"><h2>Proposte di attività sportive</h2><span class="sub">movimento su misura per forma fisica e territorio</span></div>
  </section>
  ${d ? `
  <section class="card pad">
    <div class="eyebrow">Il tuo punto di partenza</div>
    <div class="numbers" style="margin-top:.7rem">
      <div class="bignum"><span>Punteggio InBody</span><b class="num">${fmtN(d.score)}<small> /100</small></b></div>
      <div class="bignum"><span>Muscolo scheletrico</span><b class="num">${fmtN(d.smm,1)}<small> kg</small></b></div>
      <div class="bignum"><span>Grasso corporeo</span><b class="num">${fmtN(d.pbf,1)}<small> %</small></b></div>
      <div class="bignum"><span>Grasso viscerale</span><b class="num">${fmtN(d.vfl)}<small> liv.</small></b></div>
      ${d.demo?`<div class="bignum"><span>Origine</span><span class="demo-tag" style="margin-top:.2rem;display:inline-block">referto d'esempio</span></div>`:""}
    </div>
  </section>` : `<div class="notice warn">${icon("info")}<span>Senza referto le proposte restano generali.
    <button class="linkish" data-go="s2" style="background:none;border:none;padding:0">Carica i dati</button> per personalizzarle.</span></div>`}

  <section class="card pad">
    <div class="eyebrow">Quanta energia consumi? (30 minuti di attività)</div>
    <p style="color:var(--ink2); margin:.4rem 0 .8rem">${d?.energy?.length ? "Valori dal tuo referto, calcolati sul tuo peso attuale." : "Stime al peso indicato: il referto della BIA le calcola esatte."}</p>
    <div class="sportgrid">${energy.map(([n,k]) => `<div class="sport"><b>${esc(n)}</b><span class="num">${fmtN(k)}<small> kcal</small></span></div>`).join("")}</div>
  </section>

  <section class="card pad ai-zone">
    <div class="eyebrow">Il tuo piano di movimento</div>
    <div id="aiMoveZone">${aiMoveHTML()}</div>
  </section>

  <section class="card pad">
    <div class="eyebrow">Quanto movimento serve, in generale</div>
    <p class="prose" style="margin-top:.5rem">Per un adulto, l'Organizzazione Mondiale della Sanità raccomanda
      <b>150–300 minuti a settimana</b> di attività aerobica moderata (o 75–150 di attività intensa), più
      <b>due sedute di rafforzamento muscolare</b>. Non serve farlo tutto in palestra: contano anche le
      camminate a passo svelto, le scale, la bicicletta per gli spostamenti. La costanza batte l'intensità:
      meglio mezz'ora quasi ogni giorno che tre ore una tantum.</p>
  </section>

  <div class="foot-cta">
    <p class="disclaimer">Prima di iniziare un'attività intensa o agonistica è buona norma una visita

  </div>`;

function aiMoveHTML(){
  const a = state.ai.move;
  const mode = aiMode();
  if(a) return aiMoveRender(a);
  if(!mode) return `<div class="notice">${icon("info")}<span>Apri la pagina su claude.ai per generare un piano di movimento personalizzato su dati, gusti e territorio.</span></div>`;
  return `<p style="color:var(--ink2);margin:0">Tre modi diversi di muoversi — un solo sport, un mix di attività,
    o movimento nel tempo libero — costruiti su forma fisica, gusti, momenti disponibili e opportunità
    della tua zona (piste ciclabili, sentieri, mare, impianti sportivi).</p>
    <div><button class="btn primary" id="btnGenMove">${icon("spark")}Genera il mio piano</button></div>
    <div class="upstate" id="moveState" hidden></div>`;
}
function aiMoveRender(a){
  const opts = a.opzioni || [];
  return `<div class="ai-out">
    <div class="opt-tabs" id="moveTabs">${opts.map((o,i) => `<button class="tab${i===0?" on":""}" data-opt="${i}">${esc(o.titolo||("Opzione "+(i+1)))}</button>`).join("")}</div>
    <div id="moveBody"></div>
    ${a.territorio?.length?`<div class="ai-card blu"><h4>Nella tua zona</h4><ul>${a.territorio.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`:""}
    <div style="display:flex;gap:.8rem;align-items:center;flex-wrap:wrap">
      <button class="btn" id="btnRegenMove">${icon("refresh")}Rigenera</button>
      <span class="ai-note">Generato dall'AI su documento n. ${esc(state.doc?.code||"—")}, gusti e area indicata.</span>
    </div></div>`;
}
function movePrompt(){
  const p = advisePayload("move");
  return `Sei un educatore motorio. Proponi un percorso di movimento DIDATTICO (non un programma medico) in italiano per questa persona.
DATI BIA (documento anonimo): ${JSON.stringify(p.bia)}
GUSTI, MOMENTI DISPONIBILI E LUOGO: ${JSON.stringify(p.gusti)}
Crea TRE opzioni alternative: (1) dedicarsi a un solo sport scelto tra quelli che ama o vorrebbe provare, con progressione settimanale; (2) un mix di 2-3 attività diverse nella settimana; (3) movimento nel tempo libero senza sport strutturato (spostamenti attivi, scale, camminate).
Rispetta i momenti dichiarati (giorni/orari) e cita opportunità plausibili del territorio indicato (piste ciclabili, lungomare, sentieri, piscine, impianti — se conosci la zona, nomina luoghi reali; altrimenti resta generico).
Rispondi SOLO con JSON: {"opzioni":[{"titolo":"nome breve","descrizione":"2 frasi","settimana":[{"giorno":"Lun","attivita":"cosa e dove","durata":"45 min"}, ...solo i giorni attivi],"kcal_settimana":numero stimato}, {..}, {..}],"territorio":["2-4 suggerimenti legati alla zona indicata"]}`;
}
let moveCtl = null;
function wireS4(){
  $$("#main [data-go]").forEach(b => b.onclick = () => goto(b.dataset.go));
  const showOpt = i => {
    const o = (state.ai.move?.opzioni||[])[i]; if(!o) return;
    $("#moveBody").innerHTML = `<div class="ai-card"><h4>${esc(o.titolo||"")}</h4>
      <p style="margin:.1rem 0 .5rem;font-size:.88rem">${esc(o.descrizione||"")}</p>
      <div class="week">${(o.settimana||[]).map(dd => `<div class="d"><b>${esc(dd.giorno||"")}</b><span>${esc(dd.attivita||"")} ${dd.durata?`· <span class="num">${esc(dd.durata)}</span>`:""}</span></div>`).join("")}</div>
      ${o.kcal_settimana?`<p class="hint" style="margin:.5rem 0 0">≈ ${fmtN(o.kcal_settimana)} kcal a settimana</p>`:""}</div>`;
    $$("#moveTabs .tab").forEach((t,j) => t.classList.toggle("on", j===i));
  };
  if(state.ai.move){ showOpt(0); $$("#moveTabs .tab").forEach((t,i) => t.onclick = () => showOpt(i)); }
  const gen = $("#btnGenMove");
  if(gen) gen.onclick = async () => {
    const zone = $("#moveState");
    gen.disabled = true; zone.hidden = false;
    zone.innerHTML = `<div class="spin"></div><div class="hint" id="moveSub">L'AI sta preparando le proposte…</div><button class="btn" id="btnStopMove">Interrompi</button>`;
    moveCtl = new AbortController();
    $("#btnStopMove").onclick = () => moveCtl.abort();
    try{
      const a = API_BASE
        ? await apiPost("/api/advise", {kind:"move", data: advisePayload("move")}, moveCtl.signal)
        : await cap.sample.json(movePrompt(), { modelTier:"default", signal: moveCtl.signal, cache:false,
            onText: ({text}) => { const s=$("#moveSub"); if(s) s.textContent = `Sto scrivendo… (${text.length} caratteri)`; } });
      state.ai.move = a; save(); render();
    }catch(e){
      if(e && e.code === "cancelled"){ render(); return; }
      zone.innerHTML = `<div class="hint">Non sono riuscito a generare il piano (${esc(e && e.code || "errore")}). Riprova tra poco.</div>`;
      gen.disabled = false;
    }
  };
  const regen = $("#btnRegenMove");
  if(regen) regen.onclick = () => { delete state.ai.move; save(); render(); setTimeout(() => $("#btnGenMove")?.click(), 50); };
}

/* ================= report PDF ================= */
function loadJsPdf(){
  return new Promise((res, rej) => {
    if(window.jspdf) return res(window.jspdf);
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
    s.onload = () => window.jspdf ? res(window.jspdf) : rej(new Error("jsPDF non caricato"));
    s.onerror = () => rej(new Error("jsPDF non raggiungibile"));
    document.head.appendChild(s);
  });
}
const reportBtnHTML = () => (state.doc && !window.claude)
  ? `<button class="btn" data-pdf>${icon("download")}Scarica il report (PDF)</button>` : "";
async function scaricaReport(btn){
  try{
    if(btn){ btn.disabled = true; }
    const { jsPDF } = await loadJsPdf();
    const d = state.doc, g = state.gusti || {};
    const pdf = new jsPDF({unit:"pt", format:"a4"});
    const G = [31,122,86], INK = [23,33,27], GREY = [90,104,95];
    const W = 595, M = 52, CW = W - M*2;
    let y = 0;
    const page = () => { pdf.addPage(); y = 64; };
    const need = h => { if(y + h > 780) page(); };
    const h2 = t => { need(46); y += 26; pdf.setDrawColor(...G); pdf.setLineWidth(1.2); pdf.line(M, y, M+26, y);
      pdf.setFont("helvetica","bold"); pdf.setFontSize(13); pdf.setTextColor(...G); pdf.text(t, M+34, y+4); y += 22; };
    const para = (t, size=10.5, color=INK, indent=0) => {
      pdf.setFont("helvetica","normal"); pdf.setFontSize(size); pdf.setTextColor(...color);
      for(const line of pdf.splitTextToSize(t, CW - indent)){ need(15); pdf.text(line, M + indent, y); y += 14.5; } };
    const bullet = t => { need(15); pdf.setTextColor(...G); pdf.setFontSize(10.5); pdf.text("\u2022", M+4, y);
      const lines = pdf.splitTextToSize(t, CW-18); pdf.setTextColor(...INK); pdf.setFont("helvetica","normal");
      for(const l of lines){ need(15); pdf.text(l, M+16, y); y += 14.5; } y += 1; };
    // header
    pdf.setFillColor(...G); pdf.rect(0, 0, W, 78, "F");
    pdf.setTextColor(255,255,255); pdf.setFont("helvetica","bold"); pdf.setFontSize(19);
    pdf.text("Sport e Stili di Vita", M, 40);
    pdf.setFont("helvetica","normal"); pdf.setFontSize(10.5);
    pdf.text(`Report personale \u00b7 documento anonimo n. ${d.code} \u00b7 ${new Date().toLocaleDateString("it-IT")}`, M, 58);
    y = 104;
    // dati
    h2("I tuoi dati dalla BIA");
    const rows = [["Peso", d.weight, "kg"],["Muscolo scheletrico", d.smm, "kg"],["Massa grassa", d.bfm, "kg"],
      ["Grasso corporeo", d.pbf, "%"],["IMC", d.bmi, "kg/m\u00b2"],["Punteggio InBody", d.score, "/100"],
      ["Metabolismo basale", d.bmr, "kcal"],["Fabbisogno giornaliero", d.kcal, "kcal"],["Grasso viscerale", d.vfl, "liv."],
      ["Rapporto vita/fianchi", d.whr, ""],["Massa magra", d.ffm, "kg"],["Peso target", d.targetWeight, "kg"]]
      .filter(r => r[1] != null);
    const colw = CW/2;
    rows.forEach((r, i) => {
      const cx = M + (i%2)*colw, cy0 = y + Math.floor(i/2)*18;
      if(i%2===0) need(20);
      pdf.setFont("helvetica","normal"); pdf.setFontSize(10); pdf.setTextColor(...GREY); pdf.text(r[0], cx, cy0);
      pdf.setFont("helvetica","bold"); pdf.setTextColor(...INK); pdf.text(`${fmtN(r[1], r[0]==="Rapporto vita/fianchi"?2:1)} ${r[2]}`, cx + 132, cy0);
    });
    y += Math.ceil(rows.length/2)*18 + 6;
    const kcal = d.kcal || (d.bmr ? Math.round(d.bmr*1.45) : null);
    if(kcal){ h2("Le calorie della tua giornata");
      MEAL_SPLIT.forEach(([n,p]) => bullet(`${n}: circa ${Math.round(p*100)}% \u2248 ${fmtN(kcal*p)} kcal`)); }
    // consigli AI
    const a = state.ai.food;
    if(a){ h2("Consigli alimentari personalizzati");
      if(a.premessa) para(a.premessa); y += 6;
      para("Da privilegiare:", 11, G); (a.privilegiare||[]).forEach(x => bullet(`${x.cosa}${x.perche?" \u2014 "+x.perche:""}`)); y += 4;
      para("Da limitare:", 11, G); (a.limitare||[]).forEach(x => bullet(`${x.cosa}${x.perche?" \u2014 "+x.perche:""}`)); y += 4;
      para("Quantit\u00e0 indicative:", 11, G); (a.quantita||[]).forEach(x => bullet(String(x)));
    }
    const m = state.ai.move;
    if(m && m.opzioni){ h2("Il tuo piano di movimento");
      m.opzioni.forEach(o => {
        para(o.titolo || "", 11.5, G); if(o.descrizione) para(o.descrizione);
        (o.settimana||[]).forEach(dd => bullet(`${dd.giorno||""}: ${dd.attivita||""}${dd.durata?" \u00b7 "+dd.durata:""}`));
        if(o.kcal_settimana) para(`\u2248 ${fmtN(o.kcal_settimana)} kcal a settimana`, 9.5, GREY, 16);
        y += 6;
      });
      (m.territorio||[]).length && para("Nella tua zona: " + m.territorio.join("; "), 10, GREY);
    }
    if(!a && !m){ h2("Consigli personalizzati");
      para("Genera i consigli alimentari (tappa 3) e il piano di movimento (tappa 4) per includerli nel report."); }
    // footer
    need(52); y += 18; pdf.setDrawColor(...G); pdf.setLineWidth(.8); pdf.line(M, y, W-M, y); y += 14;
    para("Contenuti a scopo didattico: non sostituiscono il parere di un medico o di un nutrizionista. Documento identificato in forma anonima, senza dati personali.", 8.5, GREY);
    pdf.save(`report-sport-stili-di-vita-${d.code}.pdf`);
  }catch(e){
    toast("Non sono riuscito a generare il PDF: " + (e && e.message || e));
  }finally{ if(btn){ btn.disabled = false; } }
}
function wirePdf(){ $$("#main [data-pdf]").forEach(b => b.onclick = () => scaricaReport(b)); }

/* ================= render ================= */
function render(){
  renderStepper();
  const v = state.view;
  $("#main").innerHTML = `<div class="view">${v==="s1"?viewS1():v==="s2"?viewS2():v==="s3"?viewS3():viewS4()}</div>`;
  if(v==="s1") wireS1();
  if(v==="s2") wireS2();
  if(v==="s3") wireS3();
  if(v==="s4") wireS4();
  wirePdf();
}
render();
</script>
